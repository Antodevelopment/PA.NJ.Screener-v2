name: Daily property data refresh

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the current site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified address and source caches
        uses: actions/cache@v4
        with:
          path: |
            data/modiv-2026.zip
            data/modiv-2026.meta.json
            data/nj-geocodes.json
            data/chester-geocodes.json
          key: property-refresh-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            property-refresh-${{ runner.os }}-

      - name: Install the data reader
        run: python -m pip install openpyxl==3.1.5

      - name: Refresh official property records
        run: python scripts/import_real_data.py

      - name: Save any refreshed data
        run: |
          if git diff --quiet -- app/data/real-parcels.json app/data/refresh-status.json; then
            echo "No property or check-date changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/real-parcels.json app/data/refresh-status.json
          git commit -m "Daily property data refresh"
          git push
